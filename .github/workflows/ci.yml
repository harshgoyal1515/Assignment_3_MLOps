name: CI Pipeline for Docker Image Build and Push

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Debugging step: Show directory structure to confirm files exist
      - name: List repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repository:"
          ls -R

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run training script (this must succeed)
      - name: Run training script
        run: python src/train.py

      # Step 5: Log in to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t harshgoyal15/mlops-pipeline:latest .

      # Step 7: Push image to Docker Hub
      - name: Push Docker image
        run: docker push harshgoyal15/mlops-pipeline:latest

      # Step 8: Test container by running predict.py
      - name: Test container by running predict.py
        run: docker run --rm harshgoyal15/mlops-pipeline:latest python src/predict.py
